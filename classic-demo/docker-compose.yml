---
services:

  backend:
    image: ${IMAGE_BACKEND}:${IMAGE_BACKEND_TAG:-latest}
    environment:
      # Optional. Resets the Zope root `admin` password when the database is
      # created or seeded on first start; empty leaves credentials untouched.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - public
    deploy:
      replicas: ${STACK_BACKEND_REPLICAS:-1}
      placement:
        constraints:
          - node.labels.type == ${STACK_BACKEND_TYPE:-app}
          - node.labels.env == ${STACK_ENV}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.constraint-label=public
        # Service
        - traefik.http.services.svc-${STACK_PREFIX}-backend.loadbalancer.server.port=8080

        # Middlewares
        ## VHM: serve the Plone site ${SITE_ID} at the root of the host.
        ## The explicit :443 pins the port of the generated links. Without
        ## it, Zope takes the port from the request's Host header: fine behind
        ## Traefik (no port), wrong for a request that carries one.
        - traefik.http.middlewares.mw-${STACK_PREFIX}-backend-vhm.addprefix.prefix=/VirtualHostBase/https/${DEPLOY_HOSTNAME}:443/${SITE_ID}/VirtualHostRoot

        # Routers
        ## External /
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.rule=Host(`${DEPLOY_HOSTNAME}`)
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.entrypoints=https
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.tls=true
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.tls.certresolver=${CERTRESOLVER:-le-cloudflare}
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.service=svc-${STACK_PREFIX}-backend
        - traefik.http.routers.rt-${STACK_PREFIX}-backend.middlewares=${BACKEND_MIDDLEWARES:-gzip},mw-${STACK_PREFIX}-backend-vhm

networks:
  public:
    external: true
